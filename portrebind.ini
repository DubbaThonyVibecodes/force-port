; portrebind settings. Keep this file next to portrebind.exe and portrebind.dll.
; Comments must be on their own line.

[portrebind]

; The address of the network interface the game must use. The dialog that
; portrebind.exe shows at start fills this in, or set it by hand - either the
; exact address, or the subnet it is in (survives DHCP handing out a new one):
;   ip = 192.168.1.10
;   ip = 192.168.1.0/24
ip =

; 1 = show the dialog for picking the address each time. 0 = just start the
; game. With 0 the dialog still appears if the address above is gone, or if
; Shift is held down while portrebind.exe starts.
ask = 1

; What portrebind.exe starts when it is run without arguments.
game = C:\Program Files (x86)\Electronic Arts\Command & Conquer 3\CNC3.exe
args =

; What to do with sockets the game leaves on "any interface" (0.0.0.0):
;   none  leave them alone, only fix binds to a wrong specific address
;   udp   force UDP sockets onto the address above (LAN traffic, default)
;   all   force TCP sockets too
rewrite_any = udp

; 1 = when the game asks Windows for the machine's addresses, answer with the
; address above only. Makes the game announce the right address to others.
hide_other_ips = 1

; 1 = also patch processes started by the game. Needed: CNC3.exe is only a
; launcher, the real game is a second process (cnc3game.dat).
follow_children = 1

; 1 = write what was changed to portrebind.log next to this file.
log = 0
